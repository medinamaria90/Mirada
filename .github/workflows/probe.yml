name: probe
on:
  push:
    paths: ['pipeline/probe.sh', '.github/workflows/probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash pipeline/probe.sh
      - run: |
          git config user.name "mirada-bot"
          git config user.email "mirada-bot@users.noreply.github.com"
          git add pipeline/probe.txt
          git commit -m "probe: resultado" || exit 0
          git push
