name: pipeline
on:
  push:
    branches: [main]
    paths: ['pipeline/RUN']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pipeline
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: herramientas
        run: |
          command -v convert || (sudo apt-get update -q && sudo apt-get install -yq imagemagick)
          convert -version | head -1
          python3 -c "import PIL" 2>/dev/null || (sudo apt-get update -q && sudo apt-get install -yq python3-pil)
          python3 -c "import PIL; print('Pillow', PIL.__version__)"
          git config user.name "mirada-bot"
          git config user.email "mirada-bot@users.noreply.github.com"
      - name: pasos
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash pipeline/run.sh
      - name: log de emergencia
        if: always()
        run: |
          mkdir -p pipeline/logs
          echo "estado del job: ${{ job.status }} $(date -u)" >> pipeline/logs/run.txt
          for x in pipeline/out pipeline/logs catalogo CREDITS.md; do [ -e "$x" ] && git add -A "$x"; done
          git commit -qm "datos: log final" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q -X theirs && git push -q && exit 0; sleep 10; done
