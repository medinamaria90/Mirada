# Configuración de Render (Blueprint) de Sfumato (antes Mirada).
# Las imágenes del catálogo no están en el repo: se bajan al construir desde la release de GitHub
# (tools/fetch_images.sh comprueba el sha256). El despliegue se lanza a mano tras comprobar main.
services:
  - type: web
    name: sfumato-arte
    runtime: static
    repo: https://github.com/medinamaria90/Mirada
    branch: main
    buildCommand: bash tools/fetch_images.sh app/img
    staticPublishPath: ./app
    autoDeploy: false
    # Dominio propio (el registro DNS se pone en el registrador de dibulios.com).
    domains:
      - sfumato.dibulios.com
    # Código, estilos y datos siempre revalidados: sin mezclar módulos de dos versiones tras un despliegue.
    headers:
      - path: /js/*
        name: Cache-Control
        value: no-cache
      - path: /css/*
        name: Cache-Control
        value: no-cache
      - path: /data/*
        name: Cache-Control
        value: no-cache
      # La página también: un index.html viejo en caché dejaba fuera hojas de estilo nuevas (el mapa salía sin carteles).
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /*.html
        name: Cache-Control
        value: no-cache
  # Dirección antigua: redirige todo a la nueva.
  - type: web
    name: mirada
    runtime: static
    repo: https://github.com/medinamaria90/Mirada
    branch: main
    buildCommand: echo "redirige a sfumato-arte"
    # Solo una página de aviso: Render aplica la redirección cuando el archivo no existe.
    staticPublishPath: ./redirige-mirada
    autoDeploy: false
    routes:
      - type: redirect
        source: /*
        destination: https://sfumato-arte.onrender.com/*
