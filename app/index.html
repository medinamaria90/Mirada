<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Sfumato</title>
  <meta name="description" content="Aprende a reconocer a los grandes pintores de un vistazo.">
  <!-- Vista previa al compartir la dirección de la app (las historias llevan la suya: h/, tools/share_pages.py). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sfumato">
  <meta property="og:locale" content="es_ES">
  <meta property="og:title" content="Sfumato">
  <meta property="og:description" content="Aprende a reconocer a los grandes pintores de un vistazo, jugando.">
  <meta property="og:url" content="https://sfumato.dibulios.com/">
  <meta property="og:image" content="https://sfumato.dibulios.com/icons/icon-512.png">
  <meta property="og:image:width" content="512">
  <meta property="og:image:height" content="512">
  <meta name="theme-color" content="#f7f3ec" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e1a16" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="css/brand.css">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/mapa-vivo.css">
  <link rel="stylesheet" href="css/mapa-vida.css">
  <!-- Tema elegido en Ajustes, antes de pintar nada (el módulo llega después y así no parpadea). -->
  <script>
    try {
      const theme = JSON.parse(localStorage.getItem('mirada.state')).settings.theme;
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch {
      document.documentElement.removeAttribute('data-theme'); // sin estado legible: como el móvil
    }
  </script>
  <!-- Cadena crítica del arranque (main.js y sus importaciones estáticas): se pide en paralelo. -->
  <link rel="modulepreload" href="js/main.js">
  <link rel="modulepreload" href="js/engine/catalog.js">
  <link rel="modulepreload" href="js/engine/dates.js">
  <link rel="modulepreload" href="js/state/store.js">
  <link rel="modulepreload" href="js/state/schema.js">
  <link rel="modulepreload" href="js/ui/theme.js">
  <link rel="modulepreload" href="js/ui/load-recovery.js">
  <link rel="modulepreload" href="js/engine/progress.js">
  <link rel="modulepreload" href="js/engine/srs.js">
  <link rel="modulepreload" href="js/state/session.js">
  <link rel="modulepreload" href="js/ui/router.js">
  <link rel="modulepreload" href="js/engine/challenge.js">
  <link rel="modulepreload" href="js/ui/audio-bridge.js">
  <link rel="modulepreload" href="js/ui/art.js">
  <link rel="modulepreload" href="js/ui/dom.js">
  <link rel="modulepreload" href="js/ui/toast.js">
</head>
<body>
  <div id="app" aria-live="off">
    <div class="boot" role="status"><span class="boot-mark">Sfumato</span></div>
  </div>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>
  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
